# Checks every morning that ESPN's feeds still give the app what it needs
# (tools/check-feeds.js), so a change on ESPN's side is found before people see
# empty screens. A failure opens an issue, or comments on the one already open.
# Run it by hand from the Actions tab ("Run workflow").
name: ESPN feeds

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:feeds 2>&1 | tee feeds.log

      - name: Report the failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="ESPN feed check failed"
          {
            echo "The daily check of ESPN's feeds failed on $(date -u +%F). Failing checks:"
            echo
            echo '```'
            grep -E "FAIL|AssertionError|Error:" feeds.log | sed 's/\x1b\[[0-9;]*m//g' | sort -u | head -40 || true
            echo '```'
            echo
            echo "Full log: $RUN_URL"
          } > body.md
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
