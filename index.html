<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#dc2626" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090d14" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FalkenSports" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Free live scores, standings and news across 14 sports: football, basketball, cricket, rugby, NFL, NHL, MLB, lacrosse, volleyball, tennis, Formula 1, NASCAR and IndyCar, golf and UFC."
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
    <title>FalkenSports – Free Live Scores &amp; News</title>
    <script>
      // The saved theme, applied before anything draws, so the splash (and the
      // app's first frame) never flash the wrong colours. Same rule as theme.js.
      (function () {
        var mode = "system";
        try { mode = localStorage.getItem("kickoff_theme") || "system"; } catch (e) {}
        var dark = mode === "dark" || (mode === "system" && window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <style>
      /* Splash: shown from the first byte until the app is ready (src/index.js
         fades it out). Inline, so it needs nothing else to load. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(circle at 50% 38%, rgba(239, 68, 68, 0.14), transparent 60%), #f8fafc;
        color: #0f172a;
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      [data-theme="dark"] #splash {
        background: radial-gradient(circle at 50% 38%, rgba(239, 68, 68, 0.22), transparent 60%), #090d14;
        color: #f8fafc;
      }
      #splash.splash-done {
        opacity: 0;
        visibility: hidden;
      }
      .splash-mark {
        width: 84px;
        height: 84px;
        filter: drop-shadow(0 14px 28px rgba(220, 38, 38, 0.38));
        animation: splash-pop 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .splash-mark svg {
        width: 100%;
        height: 100%;
      }
      .splash-name {
        margin-top: 6px;
        font-size: 1.7rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        animation: splash-rise 0.6s 0.15s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .splash-tag {
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.6;
        animation: splash-rise 0.6s 0.25s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .splash-bar {
        position: relative;
        width: 120px;
        height: 3px;
        margin-top: 18px;
        overflow: hidden;
        border-radius: 3px;
        background: rgba(148, 163, 184, 0.25);
      }
      .splash-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 3px;
        background: linear-gradient(90deg, #f43f5e, #dc2626);
        animation: splash-load 1.1s ease-in-out infinite;
      }
      @keyframes splash-pop {
        from { opacity: 0; transform: scale(0.6) rotate(-8deg); }
        to { opacity: 1; transform: none; }
      }
      @keyframes splash-rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes splash-load {
        from { transform: translateX(-110%); }
        to { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-mark, .splash-name, .splash-tag, .splash-bar::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="splash" role="status" aria-label="Loading FalkenSports">
      <div class="splash-mark">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="splash-grad" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
              <stop stop-color="#f43f5e" />
              <stop offset="1" stop-color="#b91c1c" />
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#splash-grad)" />
          <path d="M10 7.5h14l-3.2 4.2H14.6v3.1h7.2l-3.2 4.2h-4v5.5L10 27.5z" fill="#fff" />
        </svg>
      </div>
      <div class="splash-name">FalkenSports</div>
      <div class="splash-tag">Live scores · every sport</div>
      <div class="splash-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
