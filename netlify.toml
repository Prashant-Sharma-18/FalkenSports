# Netlify: connect the GitHub repo and these settings are picked up automatically.
[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

# BBC Sport's RSS feeds, served from this site: BBC sends no CORS header, so
# the browser can't read them from bbc.co.uk itself (src/api/news.js).
[[redirects]]
  from = "/feeds/bbc/*"
  to = "https://feeds.bbci.co.uk/sport/:splat"
  status = 200

# The service worker and the HTML shell must always be revalidated so new
# releases reach installed apps; hashed bundles can be cached forever.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
